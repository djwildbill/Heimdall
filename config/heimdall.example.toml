# Heimdall v0.1 Alpha example configuration
# Guardian of the Bifrost — Persona: Josh

main.name = "heimdall"
main.lang = "en"
main.custom_plugins = "/usr/local/share/pwnagotchi/custom-plugins"

# Preserve the original Pwnagotchi-style active behavior by default.
# Use only on networks/environments where you have authorization.
personality.deauth = true
personality.associate = true
personality.advertise = true

# -----------------------------------------------------------------------------
# Heimdall privacy / protected-network policy
# -----------------------------------------------------------------------------
# Add every trusted/private SSID and/or BSSID here. These networks are excluded
# from active interaction by the inherited Pwnagotchi engine.
# Examples only -- replace with your own values in the local config:
# main.whitelist = ["Asgard", "AA:BB:CC:DD:EE:FF"]
main.whitelist = []

# Keep PwnGrid disabled for Odin deployments unless you intentionally opt in.
main.plugins.grid.enabled = false
main.plugins.grid.report = false

# Defense in depth: if grid reporting is ever intentionally enabled, entries in
# this list must still be excluded from grid reporting. Keep this synchronized
# with main.whitelist for trusted/private networks.
# Example:
# main.plugins.grid.exclude = ["Asgard", "AA:BB:CC:DD:EE:FF"]
main.plugins.grid.exclude = []

# Runtime mode controller.
# Modes: pwn, sentinel, recon, maintenance
main.plugins.heimdall-mode.enabled = true
main.plugins.heimdall-mode.default_mode = "pwn"
main.plugins.heimdall-mode.mode_path = "/var/lib/heimdall/mode"
main.plugins.heimdall-mode.control_endpoint = ""
main.plugins.heimdall-mode.token = ""
main.plugins.heimdall-mode.poll_interval = 15
main.plugins.heimdall-mode.timeout = 5

# Live wireless telemetry for Josh's e-paper display.
main.plugins.heimdall-telemetry.enabled = true
main.plugins.heimdall-telemetry.state_path = "/var/lib/heimdall/wireless.json"

# Heimdall heartbeat -> Odin
main.plugins.heimdall-heartbeat.enabled = true
main.plugins.heimdall-heartbeat.node_name = "heimdall-01"
main.plugins.heimdall-heartbeat.endpoint = ""
main.plugins.heimdall-heartbeat.token = ""
main.plugins.heimdall-heartbeat.interval = 60
main.plugins.heimdall-heartbeat.timeout = 5
main.plugins.heimdall-heartbeat.interface = "wlan0"
main.plugins.heimdall-heartbeat.queue_path = "/var/lib/heimdall/heartbeat-queue.jsonl"

# Local health telemetry
main.plugins.heimdall-health.enabled = true
main.plugins.heimdall-health.interval = 60
main.plugins.heimdall-health.status_path = "/var/lib/heimdall/health.json"

# SD-card write reduction
fs.memory.enabled = true
fs.memory.mounts.log.enabled = true
fs.memory.mounts.data.enabled = true

# Recommended Waveshare 2.13in V2 display.
# Change these values if Josh uses a different display.
ui.display.enabled = true
ui.display.type = "waveshare_2"
ui.display.color = "black"

# Change web credentials before exposing the management UI.
ui.web.enabled = true
ui.web.username = "heimdall"
ui.web.password = "CHANGE_ME"

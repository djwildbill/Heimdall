# Heimdall v0.1 Alpha example configuration
# Guardian of the Bifrost — Persona: Josh

main.name = "heimdall"
main.lang = "en"
main.custom_plugins = "/usr/local/share/pwnagotchi/custom-plugins"

# -----------------------------------------------------------------------------
# Defensive default posture
# -----------------------------------------------------------------------------
# Heimdall observes and documents authorized wireless environments. Active
# association/disruption features are disabled in the Odin field profile.
personality.deauth = false
personality.associate = false
personality.advertise = false

# -----------------------------------------------------------------------------
# Heimdall privacy / protected-network policy
# -----------------------------------------------------------------------------
# Add every trusted/private SSID and/or BSSID here. Keep real values ONLY in
# Josh's local configuration; do not commit them to Git.
# Example only:
# main.whitelist = ["PRIVATE_SSID", "AA:BB:CC:DD:EE:FF"]
main.whitelist = []

# Keep PwnGrid disabled for Odin deployments.
main.plugins.grid.enabled = false
main.plugins.grid.report = false
main.plugins.grid.exclude = []

# Defense in depth: protected identifiers are discarded by the legacy runtime.
main.plugins.heimdall-privacy.enabled = true
main.plugins.heimdall-privacy.protected = []

# Runtime mode controller.
# Modes: sentinel, recon, maintenance. Odin field default is sentinel.
main.plugins.heimdall-mode.enabled = true
main.plugins.heimdall-mode.default_mode = "sentinel"
main.plugins.heimdall-mode.mode_path = "/var/lib/heimdall/mode"
main.plugins.heimdall-mode.control_endpoint = ""
main.plugins.heimdall-mode.token = ""
main.plugins.heimdall-mode.poll_interval = 10
main.plugins.heimdall-mode.timeout = 5

# Live wireless telemetry for Josh's e-paper display.
main.plugins.heimdall-telemetry.enabled = true
main.plugins.heimdall-telemetry.state_path = "/var/lib/heimdall/wireless.json"

# High-contrast Josh display: centered face, large text, live SSID + handshake
# state. It drives its own conservative partial refresh every five seconds, so
# ui.fps can remain 0 and the e-paper is not hammered continuously.
main.plugins.heimdall-display.enabled = true
main.plugins.heimdall-display.state_path = "/var/lib/heimdall/wireless.json"
main.plugins.heimdall-display.health_path = "/var/lib/heimdall/health.json"
main.plugins.heimdall-display.mode_path = "/var/lib/heimdall/mode"
main.plugins.heimdall-display.refresh_seconds = 5

# Bifrost update/reboot display. This draws the full-screen Viking journey and
# intentionally leaves the REBOOTING frame on e-paper while Linux is down.
main.plugins.heimdall-bifrost-display.enabled = true
main.plugins.heimdall-bifrost-display.state_path = "/var/lib/heimdall/bifrost-display.json"

# Heimdall heartbeat -> Odin
main.plugins.heimdall-heartbeat.enabled = true
main.plugins.heimdall-heartbeat.node_name = "heimdall-01"
main.plugins.heimdall-heartbeat.endpoint = ""
main.plugins.heimdall-heartbeat.token = ""
main.plugins.heimdall-heartbeat.interval = 10
main.plugins.heimdall-heartbeat.timeout = 5
main.plugins.heimdall-heartbeat.interface = "wlan0"
main.plugins.heimdall-heartbeat.queue_path = "/var/lib/heimdall/heartbeat-queue.jsonl"

# Local health telemetry
main.plugins.heimdall-health.enabled = true
main.plugins.heimdall-health.interval = 10
main.plugins.heimdall-health.status_path = "/var/lib/heimdall/health.json"

# SD-card write reduction
fs.memory.enabled = true
fs.memory.mounts.log.enabled = true
fs.memory.mounts.data.enabled = true

# Recommended Waveshare 2.13in V2 display.
# Change these values if Josh uses a different display.
ui.display.enabled = true
ui.display.type = "waveshare_2"
ui.display.color = "black"

# The Heimdall display plugin performs a five-second partial refresh itself.
ui.fps = 0.0

# Keep web UI credentials local and strong. Bifrost/Tailscale should be the
# remote transport; do not expose this interface publicly.
ui.web.enabled = true
ui.web.username = "heimdall"
ui.web.password = "CHANGE_ME"

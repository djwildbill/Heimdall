name: Heimdall Companion APK

on:
  workflow_dispatch:
  push:
    branches: [heimdall-dev]
    paths:
      - 'android/HeimdallCompanion/**'
      - '.github/workflows/heimdall-companion-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/HeimdallCompanion
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-companion-debug
          path: android/HeimdallCompanion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
